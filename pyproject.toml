[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsyguard"
version = "0.3.0"
description = "Real-Time AI Drowsiness Detection and Alert System"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame",
    "opencv-python"
]

[tool.setuptools.packages.find]
where = ["src"]